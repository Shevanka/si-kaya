<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dompet Harian</title>

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="manifest" href="./manifest.json" />

    <meta name="theme-color" content="#111827" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div>
          <p class="eyebrow">Offline-first PWA</p>
          <h1>Dompet Harian</h1>
        </div>

        <div class="status-group">
          <div id="connectionStatus" class="status offline">Offline</div>

          <div id="syncStatus" class="status sync-idle">Sync idle</div>
        </div>
      </header>

      <section class="card summary-card">
        <p>Total hari ini</p>
        <h2 id="todayTotal">Rp0</h2>
      </section>

      <section class="card">
        <h2 class="section-title">Catat Pengeluaran</h2>

        <form id="expenseForm" class="expense-form">
          <input type="hidden" id="editingExpenseId" />

          <div class="form-group">
            <label for="date">Tanggal</label>
            <input type="date" id="date" required />
          </div>

          <div class="form-group">
            <label for="amount">Nominal</label>
            <input type="number" id="amount" placeholder="Contoh: 25000" min="1" required />
          </div>

          <div class="form-group">
            <label for="category">Kategori</label>
            <select id="category" required>
              <option value="">Pilih kategori</option>
              <option value="Makan">Makan</option>
              <option value="Transport">Transport</option>
              <option value="Belanja">Belanja</option>
              <option value="Tagihan">Tagihan</option>
              <option value="Hiburan">Hiburan</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>

          <div class="form-group">
            <label for="note">Catatan</label>
            <input type="text" id="note" placeholder="Contoh: nasi ayam" />
          </div>
          <p id="categorySuggestion" class="category-suggestion">
            Tulis catatan untuk deteksi kategori otomatis.
          </p>

          <div class="form-actions">
            <button type="submit" id="submitButton" class="primary-button">
              Simpan Pengeluaran
            </button>

            <button type="button" id="cancelEditButton" class="secondary-button hidden">
              Batal Edit
            </button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="section-header">
          <h2 class="section-title">Riwayat Hari Ini</h2>
          <button id="clearTodayButton" class="secondary-button" type="button">
            Hapus Hari Ini
          </button>
        </div>

        <div id="expenseList" class="expense-list">
          <p class="empty-state">Belum ada transaksi hari ini.</p>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="index.html" class="active">
        <span>🏠</span>
        <small>Home</small>
      </a>

      <a href="reports.html">
        <span>📊</span>
        <small>Laporan</small>
      </a>

      <a href="budget.html">
        <span>💰</span>
        <small>Budget</small>
      </a>

      <a href="categories.html">
        <span>🏷️</span>
        <small>Kategori</small>
      </a>

      <a href="reminder.html">
        <span>🔔</span>
        <small>Reminder</small>
      </a>
    </nav>

    <script src="./js/db.js"></script>
    <script src="./js/sync.js"></script>
    <script src="./js/app.js"></script>
    <script src="./js/navigation.js"></script>
  </body>
</html>
