<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget - Dompet Harian</title>

    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div>
          <p class="eyebrow">Offline-first PWA</p>
          <h1>Budget</h1>
        </div>

        <div class="status-group">
          <div id="connectionStatus" class="status offline">Offline</div>
          <div id="syncStatus" class="status sync-idle">Sync idle</div>
        </div>
      </header>

      <section class="card">
        <h2 class="section-title">Budget Bulanan</h2>

        <form id="budgetForm">
          <div class="form-group">
            <label for="monthlyBudgetInput"> Budget Bulanan (Rp) </label>

            <input type="number" id="monthlyBudgetInput" min="0" placeholder="3000000" />
          </div>

          <button type="submit" class="primary-button">Simpan Budget</button>
        </form>

        <div class="budget-summary">
          <p>
            Budget:
            <strong id="budgetDisplay">Rp0</strong>
          </p>

          <p>
            Terpakai:
            <strong id="budgetUsed">Rp0</strong>
          </p>

          <p>
            Sisa:
            <strong id="budgetRemaining">Rp0</strong>
          </p>

          <p id="budgetStatus">Budget belum diatur</p>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="index.html">
        <span>🏠</span>
        <small>Home</small>
      </a>

      <a href="reports.html">
        <span>📊</span>
        <small>Laporan</small>
      </a>

      <a href="budget.html" class="active">
        <span>💰</span>
        <small>Budget</small>
      </a>

      <a href="categories.html">
        <span>🏷️</span>
        <small>Kategori</small>
      </a>

      <a href="reminder.html">
        <span>🔔</span>
        <small>Reminder</small>
      </a>
    </nav>

    <script src="./js/db.js"></script>
    <script src="./js/sync.js"></script>
    <script src="./js/app.js"></script>
    <script src="./js/navigation.js"></script>
  </body>
</html>
