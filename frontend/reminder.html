<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reminder - Dompet Harian</title>

    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div>
          <p class="eyebrow">Offline-first PWA</p>
          <h1>Reminder</h1>
        </div>

        <div class="status-group">
          <div id="connectionStatus" class="status offline">Offline</div>
          <div id="syncStatus" class="status sync-idle">Sync idle</div>
        </div>
      </header>

      <section class="card">
        <h2 class="section-title">Pengingat Harian</h2>

        <form id="reminderForm">
          <div class="form-group">
            <label class="toggle-wrapper">
              Aktifkan pengingat
              <input type="checkbox" id="reminderEnabled" class="toggle-checkbox" />
              <span class="toggle-slider"></span>
            </label>
          </div>

          <div class="form-group">
            <label for="reminderTime"> Jam Pengingat </label>

            <input type="time" id="reminderTime" value="20:00" />
          </div>

          <button type="submit" class="primary-button">Simpan Pengingat</button>
        </form>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="index.html">
        <span>🏠</span>
        <small>Home</small>
      </a>

      <a href="reports.html">
        <span>📊</span>
        <small>Laporan</small>
      </a>

      <a href="budget.html">
        <span>💰</span>
        <small>Budget</small>
      </a>

      <a href="categories.html">
        <span>🏷️</span>
        <small>Kategori</small>
      </a>

      <a href="reminder.html" class="active">
        <span>🔔</span>
        <small>Reminder</small>
      </a>
    </nav>

    <script src="./js/db.js"></script>
    <script src="./js/sync.js"></script>
    <script src="./js/app.js"></script>
    <script src="./js/navigation.js"></script>
  </body>
</html>
